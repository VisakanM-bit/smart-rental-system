[theme]
base = "dark"
primaryColor = "#5EEAD4"
backgroundColor = "#09111F"
secondaryBackgroundColor = "#111D30"
textColor = "#E8EEF8"
borderColor = "#243451"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true
font = "'Inter', 'Segoe UI', sans-serif"
codeFont = "'Cascadia Code', monospace"
chartCategoricalColors = ["#5EEAD4", "#60A5FA", "#FBBF24", "#FB7185", "#A78BFA"]

[theme.sidebar]
backgroundColor = "#0D1728"
secondaryBackgroundColor = "#16243A"
textColor = "#E8EEF8"
borderColor = "#243451"
